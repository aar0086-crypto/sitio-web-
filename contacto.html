<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de contacto</title>
</head>
<body>
    <h1>Formulario de Contacto</h1>
    <form action="datos.php" method="post">

    <fieldset> 
        <legend>Datos personales</legend>

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre"
        </p>

        <p>
            <label for="apellidos">Apellidos:</label>
            <input type="text" id="apellidos" name="apellidos"            
        </p>

        <p>
            <label for="correo">Correo electronico:</label>
            <input type="email" id="correo" name="correo"
        </p>

        <p>
            <label for="password">Contraseña:</label>
            <input type="password" id="password" name="password"
        </p>

        <p>
            <label for="edad">Edad:</label>
            <input type="number" id="edad" name="edad"
        </p>
    </fieldset>
    <br> 

    <fieldset>
        <legend>Ciudad</legend>
        <label for="ciudad">Selecciona tu ciudad</label>

        <select id="ciudad" name="ciudad">
            <option value="jaen">Jaén</option>
                <option value="granada">Granada</option>
                <option value="sevilla">Sevilla</option>
                <option value="cordoba">Córdoba</option>
                <option value="malaga">Málaga</option>
                <option value="cadiz">Cádiz</option>
                <option value="huelva">Huelva</option>
                <option value="almeria">Almería</option>
        </select>
    </fieldset>
    <br>

    <fieldset>
        <legend>Aficiones</legend>
        <p>Selecciona tus aficiones:</p>

    <input type="checkbox" id="videojuegos" name="videojuegos" value="videojuegos"
    <label for="videojuegos">Videojuegos</label>
    <br>

    <input type="checkbox" id="deporte" name="deporte" value="deporte"
    <label for="deporte">Deporte</label>
    <br>

    <input type="checkbox" id="cine" name="cine" value="cine"
    <label for="cine">Cine</label>
    
    <br>

   <input type="checkbox" id="lectura" name="lectura" value="lectura"
   <label for="lectura">Lectura</label>
    </fieldset>

    <br>

    <fieldset>
        <legend>Mensaje</legend>

        <label for="mensaje">Escrbe tu mensaje</label>
        <br>


        <textarea id="mensaje" name="mensaje"
        rows="8" cols="50"
        placeholder="Escribe aqui tu mensaje"></textarea>
    </fieldset>
    <br>

    <button type="submit">Enviar</button>
    <button type="reset">Borrar</button>

    <nav>
        <a href="index.html">Enlace de Vuelta</a><br>
        <a href="horarios.html">Horarios</a>
    </nav>

   </form>


</body>
</html>
